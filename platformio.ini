[platformio]
; Isolate dependencies from incomplete packages in the shared user cache.
packages_dir = .pio/packages

[env:esp32dev]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0
build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
board_build.embed_txtfiles = web/index.html
